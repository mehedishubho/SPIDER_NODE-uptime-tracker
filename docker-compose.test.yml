# Local test stack for the characterization suite (FND-04).
# Ports are deliberately offset from any local defaults (5432/6379) so the
# stack can never collide with — or be mistaken for — a real database.
# 5453/6390 (not the planned 5433/6380): this dev machine already runs sibling
# project stacks on 5433 (devsroom_personal_tracker_db) and 6380
# (devsroom-license-manager-redis) — see 02-02-SUMMARY deviations.
# Redis is wired-but-unused by app code until Phase 3 (FND-04 wording).
# Bring up:  docker compose -f docker-compose.test.yml up -d --wait
# Tear down: docker compose -f docker-compose.test.yml down
name: spidernode-test

services:
  db:
    image: postgres:17-alpine
    container_name: spidernode-test-db
    ports:
      - "5453:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uptime_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    container_name: spidernode-test-redis
    ports:
      - "6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20
